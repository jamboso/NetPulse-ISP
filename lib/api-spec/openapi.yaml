      operationId: updateTr069AcsConfig
      tags: [tr069]
      summary: Configure or rotate the encrypted GenieACS NBI connector
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Tr069AcsConfigInput" }
      responses:
        "200":
          description: Saved ACS connector status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tr069AcsConfig" }
        "400": { description: Invalid or non-HTTPS connector input }
        "403": { description: Admin role required }

  /tr069/devices:
    get:
      operationId: listTr069Devices
      tags: [tr069]
      summary: List CPEs enrolled from the active company’s ONU inventory
      responses:
        "200":
          description: Enrolled TR-069 CPEs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tr069Device" }

  /tr069/onus/{onuId}/device:
    put:
      operationId: enrollTr069Onu
      tags: [tr069]
      summary: Enable an ONU-backed CPE for externally managed TR-069
      parameters:
        - name: onuId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Tr069DeviceEnrollment" }
      responses:
        "200":
          description: Enrolled CPE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tr069Device" }
        "400": { description: Invalid enrollment or missing secure ACS device authentication confirmation }
        "404": { description: ONU or ACS connector not found }
        "403": { description: Admin or technician role required }

  /tr069/devices/{id}/refresh:
    post:
      operationId: refreshTr069Device
      tags: [tr069]
      summary: Read current CPE state and supported data model from GenieACS
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Refreshed CPE state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tr069Device" }
        "404": { description: CPE not found }
        "409": { description: Connector has not been configured or is disabled }
        "502": { description: ACS could not be reached }

  /tr069/commands:
    get:
      operationId: listTr069Commands
      tags: [tr069]
      summary: List the active company’s auditable CPE command history
      responses:
        "200":
          description: TR-069 command history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tr069Command" }
    post:
      operationId: createTr069Command
      tags: [tr069]
      summary: Translate a supported service profile into an ACS task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Tr069CommandInput" }
      responses:
        "201":
          description: Queued or completed ACS command
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tr069Command" }
        "400": { description: Invalid or cross-tenant ONU/profile reference }
        "409": { description: CPE or connector is not ready for management }
        "422": { description: Requested parameters are unsupported by this reported CPE data model }
        "502": { description: ACS could not be reached }

  /tr069/commands/{id}/retry:
    post:
      operationId: retryTr069Command
      tags: [tr069]
      summary: Retry a failed, offline, or queued TR-069 command
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Updated command attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tr069Command" }
        "404": { description: Command not found }
        "409": { description: Command cannot be retried in its current state }
        "502": { description: ACS could not be reached }

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    EmailResult:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string

    # ── FIBER ACCESS ──────────────────────────────────────────────────────────
    OltCompatibilityProfile:
      type: object
      required: [vendor, models, ponTechnologies, ponPortCapacity, firmwareRequirement, managementRequirement, status, message]
      properties:
        vendor: { type: string }
        models:
          type: array
          items: { type: string }
        ponTechnologies:
          type: array
          items: { type: string, enum: [epon, gpon] }
        ponPortCapacity: { type: string }
        firmwareRequirement: { type: string }
        managementRequirement: { type: string }
        status: { type: string, enum: [recognized-read-only] }
        message: { type: string }

    Olt:
      type: object
      required: [id, name, vendor, model, firmwareVersion, ponTechnology, managementHost, managementPort, managementProtocol, enabled, healthState, credentialsConfigured, capability, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        vendor: { type: string }
        model: { type: string }
        firmwareVersion: { type: ["string", "null"] }
        ponTechnology: { type: string, enum: [epon, gpon] }
        managementHost: { type: string }
        managementPort: { type: integer }
        managementProtocol: { type: string, enum: [snmp-v2c, snmp-v3, ssh, https, telnet] }
        location: { type: ["string", "null"] }
        enabled: { type: boolean }
        healthState: { type: string, enum: [online, offline, unknown] }
        lastHealthCheckAt: { type: ["string", "null"], format: date-time }
        lastDiscoveryAt: { type: ["string", "null"], format: date-time }
        lastError: { type: ["string", "null"] }
        credentialsConfigured: { type: boolean }
        capability:
          type: object
          required: [status, discoveryEnabled, provisioningEnabled, message]
          properties:
            status: { type: string, enum: [mib-validated-read-only, standard-identity-read-only, recognized-read-only, unsupported] }
            discoveryEnabled: { type: boolean }
            provisioningEnabled: { type: boolean }
            message: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OltInput:
      type: object
      additionalProperties: false
      required: [name, vendor, model, ponTechnology, managementHost, managementProtocol, managementSecret]
      properties:
        name: { type: string, minLength: 1 }
        vendor: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        firmwareVersion: { type: ["string", "null"] }
        ponTechnology: { type: string, enum: [epon, gpon] }
        managementHost: { type: string, minLength: 1 }
        managementPort: { type: integer, minimum: 1, maximum: 65535, default: 161 }
        managementProtocol: { type: string, enum: [snmp-v2c, snmp-v3, ssh, https, telnet] }
        managementUsername: { type: string }
        managementSecret: { type: string, minLength: 1, writeOnly: true }
        location: { type: ["string", "null"] }
        enabled: { type: boolean, default: true }

    OltUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        vendor: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
        firmwareVersion: { type: ["string", "null"] }
        ponTechnology: { type: string, enum: [epon, gpon] }
        managementHost: { type: string, minLength: 1 }
        managementPort: { type: integer, minimum: 1, maximum: 65535 }
        managementProtocol: { type: string, enum: [snmp-v2c, snmp-v3, ssh, https, telnet] }
        managementUsername: { type: string }
        managementSecret: { type: string, minLength: 1, writeOnly: true }
        location: { type: ["string", "null"] }
        enabled: { type: boolean }

    OltPonPort:
      type: object
      required: [id, oltId, portNumber, state]
      properties:
        id: { type: integer }
        oltId: { type: integer }
        portNumber: { type: string }
        label: { type: ["string", "null"] }
        state: { type: string }
        opticalState: { type: ["string", "null"] }
        lastSeenAt: { type: ["string", "null"], format: date-time }

    OltDetail:
      allOf:
        - $ref: "#/components/schemas/Olt"
        - type: object
          required: [ponPorts]
          properties:
            ponPorts:
              type: array
              items: { $ref: "#/components/schemas/OltPonPort" }

    Onu:
      type: object
      required: [id, oltId, provisioningState, createdAt, updatedAt]
      properties:
        id: { type: integer }
        oltId: { type: integer }
        ponPortId: { type: ["integer", "null"] }
        serialNumber: { type: ["string", "null"] }
        loid: { type: ["string", "null"] }
        vendor: { type: ["string", "null"] }
        model: { type: ["string", "null"] }
        macAddress: { type: ["string", "null"] }
        opticalState: { type: ["string", "null"] }
        rxPowerDbm: { type: ["string", "null"] }
        txPowerDbm: { type: ["string", "null"] }
        provisioningState: { type: string }
        customerId: { type: ["integer", "null"] }
        lastSeenAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OltServiceProfile:
      type: object
      required: [id, name, vlanId, accessMode, enabled, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        vlanId: { type: integer }
        accessMode: { type: string, enum: [bridge, router, pppoe, dhcp] }
        downstreamKbps: { type: ["integer", "null"] }
        upstreamKbps: { type: ["integer", "null"] }
        tr069InformIntervalSeconds:
          type: ["integer", "null"]
          minimum: 60
          maximum: 86400
          description: Optional standard CWMP periodic inform interval for verified TR-098/TR-181 CPEs.
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OltServiceProfileInput:
      type: object
      additionalProperties: false
      required: [name, vlanId, accessMode]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        vlanId: { type: integer, minimum: 1, maximum: 4094 }
        accessMode: { type: string, enum: [bridge, router, pppoe, dhcp] }
        downstreamKbps: { type: ["integer", "null"], minimum: 1 }
        upstreamKbps: { type: ["integer", "null"], minimum: 1 }
        tr069InformIntervalSeconds: { type: ["integer", "null"], minimum: 60, maximum: 86400 }
        enabled: { type: boolean, default: true }

    OltServiceProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        vlanId: { type: integer, minimum: 1, maximum: 4094 }
        accessMode: { type: string, enum: [bridge, router, pppoe, dhcp] }
        downstreamKbps: { type: ["integer", "null"], minimum: 1 }
        upstreamKbps: { type: ["integer", "null"], minimum: 1 }
        tr069InformIntervalSeconds: { type: ["integer", "null"], minimum: 60, maximum: 86400 }
        enabled: { type: boolean }

    OltProvisioningJob:
      type: object
      required: [id, oltId, operation, status, dryRun, requiresApproval, requestedBy, createdAt]
      properties:
        id: { type: integer }
        oltId: { type: integer }
        onuId: { type: ["integer", "null"] }
        serviceProfileId: { type: ["integer", "null"] }
        operation: { type: string, enum: [discovery, provision, rollback] }
        status: { type: string }
        dryRun: { type: boolean }
        requiresApproval: { type: boolean }
        approvedAt: { type: ["string", "null"], format: date-time }
        approvedBy: { type: ["string", "null"] }
        requestedBy: { type: string }
        result: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
        startedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    OltProvisioningJobInput:
      type: object
      additionalProperties: false
      required: [oltId, onuId, serviceProfileId, operation]
      properties:
        oltId: { type: integer }
        onuId: { type: integer }
        serviceProfileId: { type: integer }
        operation: { type: string, enum: [provision, rollback] }
        dryRun: { type: boolean, default: true }

    MpesaIpAllowlist:
      type: object
      required: [source, cidrs]
      properties:
        source:
          type: string
          enum: [db, env, default]
          description: Where the effective list came from
        cidrs:
          type: array
          items:
            type: string
          description: CIDR blocks (or '*' for bypass) that will be applied on the next callback

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── AI DIAGNOSTICS ASSISTANT ──────────────────────────────────────────────
    OpenaiConversation:
      type: object
      required: [id, title, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time

    OpenaiConversationInput:
      type: object
      required: [title]
      properties:
        title:
          type: string

    OpenaiMessage:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    OpenaiConversationWithMessages:
      type: object
      required: [id, title, createdAt, messages]
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"

    OpenaiMessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string

    OpenaiError:
      type: object
      required: [error]
      properties:
        error:
          type: string

    DiagnosticsSnapshot:
      type: object
      required: [generatedAt, database, schemaDrift, routers, version]
      properties:
        generatedAt:
          type: string
          format: date-time
        database:
          type: object
          required: [connected]
          properties:
            connected:
              type: boolean
            error:
              type: string
        schemaDrift:
          type: object
          required: [hasDrift, missingColumns]
          properties:
            hasDrift:
              type: boolean
            missingColumns:
              type: array
              items:
                type: string
        routers:
          type: object
          required: [total, online, offline]
          properties:
            total:
              type: integer
            online:
              type: integer
            offline:
              type: integer
        version:
          type: object
          required: [commit, branch, updateAvailable]
          properties:
            commit:
              type: string
            branch:
              type: string
            updateAvailable:
              type: boolean
        openTickets:
          type: integer
        failedPaymentsLast7Days:
          type: integer

    # ── DASHBOARD ──────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required:
        - totalCustomers
        - activeSubscriptions
        - overdueInvoices
        - monthlyRevenue
        - openTickets
        - totalEquipment
        - totalIpPools
        - newCustomersThisMonth
      properties:
        totalCustomers:
          type: integer
        activeSubscriptions:
          type: integer
        overdueInvoices:
          type: integer
        monthlyRevenue:
          type: number
        openTickets:
          type: integer
        totalEquipment:
          type: integer
        totalIpPools:
          type: integer
        newCustomersThisMonth:
          type: integer

    RevenuePoint:
      type: object
      required: [month, revenue, invoiceCount]
      properties:
        month:
          type: string
        revenue:
          type: number
        invoiceCount:
          type: integer

    ActivityItem:
      type: object
      required: [id, type, description, timestamp, entityId, entityType]
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        timestamp:
          type: string
        entityId:
          type: integer
        entityType:
          type: string

    BreakdownItem:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: integer

    # ── CUSTOMERS ──────────────────────────────────────────────────────────────
    Customer:
      type: object
      required:
        - id
        - name
        - email
        - phone
        - address
        - status
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        status:
          type: string
          enum: [active, suspended, terminated]
        notes:
          type: ["string", "null"]
        pppoeUsername:
          type: ["string", "null"]
        pppoePassword:
          type: ["string", "null"]
        createdAt:
          type: string

    CustomerList:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    CustomerInput:
      type: object
      required: [name, email, phone, address]
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        status:
          type: string
          enum: [active, suspended, terminated]
        notes:
          type: string
        pppoeUsername:
          type: string
        pppoePassword:
          type: string

    CustomerUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        status:
          type: string
          enum: [active, suspended, terminated]
        notes:
          type: ["string", "null"]
        pppoeUsername:
          type: ["string", "null"]
        pppoePassword:
          type: ["string", "null"]

    # ── PLANS ──────────────────────────────────────────────────────────────────
    Plan:
      type: object
      required:
        - id
        - name
        - downloadSpeed
        - uploadSpeed
        - price
        - billingCycle
        - isActive
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        downloadSpeed:
          type: integer
          description: Download speed in Mbps
        uploadSpeed:
          type: integer
          description: Upload speed in Mbps
        price:
          type: number
        billingCycle:
          type: string
          enum: [monthly, quarterly, annually]
        isActive:
          type: boolean
        rosProfileName:
          type: ["string", "null"]
          description: RouterOS PPP profile name (e.g. plan-5mbps)
        createdAt:
          type: string

    PlanInput:
      type: object
      required: [name, downloadSpeed, uploadSpeed, price, billingCycle]
      properties:
        name:
          type: string
        description:
          type: string
        downloadSpeed:
          type: integer
        uploadSpeed:
          type: integer
        price:
          type: number
        billingCycle:
          type: string
          enum: [monthly, quarterly, annually]
        isActive:
          type: boolean
        rosProfileName:
          type: string
          description: RouterOS PPP profile name (e.g. plan-5mbps)

    PlanUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        downloadSpeed:
          type: integer
        uploadSpeed:
          type: integer
        price:
          type: number
        billingCycle:
          type: string
          enum: [monthly, quarterly, annually]
        isActive:
          type: boolean
        rosProfileName:
          type: ["string", "null"]
          description: RouterOS PPP profile name (e.g. plan-5mbps)

    # ── SUBSCRIPTIONS ──────────────────────────────────────────────────────────
    Subscription:
      type: object
      required:
        - id
        - customerId
        - planId
        - status
        - startDate
        - createdAt
      properties:
        id:
          type: integer
        customerId:
          type: integer
        planId:
          type: integer
        status:
          type: string
          enum: [active, suspended, cancelled, expired]
        startDate:
          type: string
        endDate:
          type: ["string", "null"]
        ipAddress:
          type: ["string", "null"]
        macAddress:
          type: ["string", "null"]
        routerId:
          type: ["integer", "null"]
          description: RouterOS router to provision PPPoE secret on
        pppoeUsername:
          type: ["string", "null"]
          description: Auto-generated PPPoE username
        pppoePassword:
          type: ["string", "null"]
          description: Auto-generated PPPoE password
        createdAt:
          type: string
        customer:
          $ref: "#/components/schemas/Customer"
        plan:
          $ref: "#/components/schemas/Plan"

    SubscriptionInput:
      type: object
      required: [customerId, planId, startDate]
      properties:
        customerId:
          type: integer
        planId:
          type: integer
        routerId:
          type: integer
          description: RouterOS router to provision PPPoE secret on
        status:
          type: string
          enum: [active, suspended, cancelled, expired]
        startDate:
          type: string
        endDate:
          type: string
        ipAddress:
          type: string
        macAddress:
          type: string

    SubscriptionUpdate:
      type: object
      properties:
        planId:
          type: integer
        routerId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [active, suspended, cancelled, expired]
        endDate:
          type: ["string", "null"]
        ipAddress:
          type: ["string", "null"]
        macAddress:
          type: ["string", "null"]

    # ── INVOICES ───────────────────────────────────────────────────────────────
    Invoice:
      type: object
      required:
        - id
        - customerId
        - amount
        - status
        - dueDate
        - createdAt
      properties:
        id:
          type: integer
        customerId:
          type: integer
        subscriptionId:
          type: ["integer", "null"]
        amount:
          type: number
        tax:
          type: ["number", "null"]
        total:
          type: number
        status:
          type: string
          enum: [draft, sent, paid, overdue, cancelled]
        dueDate:
          type: string
        paidAt:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        customer:
          $ref: "#/components/schemas/Customer"

    InvoiceList:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    InvoiceInput:
      type: object
      required: [customerId, amount, dueDate]
      properties:
        customerId:
          type: integer
        subscriptionId:
          type: integer
        amount:
          type: number
        tax:
          type: number
        status:
          type: string
          enum: [draft, sent, paid, overdue, cancelled]
        dueDate:
          type: string
        notes:
          type: string

    InvoiceUpdate:
      type: object
      properties:
        amount:
          type: number
        tax:
          type: ["number", "null"]
        status:
          type: string
          enum: [draft, sent, paid, overdue, cancelled]
        dueDate:
          type: string
        paidAt:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    # ── PAYMENTS ───────────────────────────────────────────────────────────────
    Payment:
      type: object
      required:
        - id
        - customerId
        - invoiceId
        - amount
        - method
        - status
        - createdAt
      properties:
        id:
          type: integer
        customerId:
          type: integer
        invoiceId:
          type: integer
        amount:
          type: number
        method:
          type: string
          enum: [cash, bank_transfer, mobile_money, card, cheque]
        status:
          type: string
          enum: [pending, completed, failed, refunded]
        reference:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        customer:
          $ref: "#/components/schemas/Customer"

    PaymentInput:
      type: object
      required: [customerId, invoiceId, amount, method]
      properties:
        customerId:
          type: integer
        invoiceId:
          type: integer
        amount:
          type: number
