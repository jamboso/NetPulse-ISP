name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build
        env:
          NODE_ENV: production

      - name: Build ISP portal
        run: pnpm --filter @workspace/isp-portal run build
        env:
          NODE_ENV: production
          PORT: "19580"
          BASE_PATH: "/"

      - name: Build mockup sandbox
        run: pnpm --filter @workspace/mockup-sandbox run build
        env:
          NODE_ENV: production
          PORT: "8081"
          BASE_PATH: "/__mockup"
