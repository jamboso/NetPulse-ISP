        status:
          type: string
          enum: [draft, sent, paid, overdue, cancelled]
        dueDate:
          type: string
        paidAt:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    # ── PAYMENTS ───────────────────────────────────────────────────────────────
    Payment:
      type: object
      required:
        - id
        - customerId
        - invoiceId
        - amount
        - method
        - status
        - createdAt
      properties:
        id:
          type: integer
        customerId:
          type: integer
        invoiceId:
          type: integer
        amount:
          type: number
        method:
          type: string
          enum: [cash, bank_transfer, mobile_money, card, cheque]
        status:
          type: string
          enum: [pending, completed, failed, refunded]
        reference:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        customer:
          $ref: "#/components/schemas/Customer"

    PaymentInput:
      type: object
      required: [customerId, invoiceId, amount, method]
      properties:
        customerId:
          type: integer
        invoiceId:
          type: integer
        amount:
          type: number
        method:
          type: string
