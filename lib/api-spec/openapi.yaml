openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ISP Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: Staff user management (admin only)
  - name: customers
    description: Customer management
  - name: plans
    description: Internet service plans
  - name: subscriptions
    description: Customer subscriptions
  - name: invoices
    description: Billing and invoices
  - name: payments
    description: Payment records
  - name: tickets
    description: Support tickets
  - name: equipment
    description: Network equipment/routers
  - name: ip-pools
    description: IP address pool management
  - name: dashboard
    description: Dashboard analytics and summaries
  - name: settings
    description: Application settings
  - name: routers
    description: Managed router devices (RouterOS, Juniper, EdgeRouter)
  - name: audit-logs
    description: Audit trail of sensitive mutations
  - name: radius
    description: FreeRADIUS integration — RADIUS session data and sync
  - name: vpn
    description: OpenVPN certificate management — issue and revoke per customer
  - name: security-events
    description: Blocked M-Pesa callback attempts and security event log
  - name: openai
    description: AI diagnostics assistant (admin only) — chat conversations backed by live system diagnostics
  - name: fiber-access
    description: Tenant-scoped OLT, ONU, and fiber service profile management

paths:
  # ── AI DIAGNOSTICS ASSISTANT ─────────────────────────────────────────────────
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all diagnostics chat conversations (admin only)
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new diagnostics chat conversation (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a diagnostics question and receive a streaming text response (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
  /openai/diagnostics-snapshot:
    get:
      operationId: getDiagnosticsSnapshot
      tags: [openai]
      summary: Get a live system health snapshot (admin only)
      responses:
        "200":
          description: Diagnostics snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticsSnapshot"
  # ── USERS (STAFF MANAGEMENT) ─────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all staff user accounts (admin only)
      parameters:
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: List of staff users
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StaffUser"
        "403":
          description: Forbidden — admin role required
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new staff account (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Created staff user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedStaffUser"
        "400":
          description: Validation error or email already exists
        "403":
          description: Forbidden — admin role required

  /users/welcome-email-preview:
    get:
      operationId: getWelcomeEmailPreview
      tags: [users]
      summary: Return HTML preview of the welcome email (admin only)
      responses:
        "200":
          description: Welcome email HTML preview and SMTP status
          content:
            application/json:
              schema:
                type: object
                required: [html, smtpConfigured]
                properties:
                  html:
                    type: string
                    description: Rendered HTML body of the welcome email
                  smtpConfigured:
                    type: boolean
                    description: Whether SMTP settings are configured
        "403":
          description: Forbidden — admin role required

  /users/welcome-email-preview/send:
    post:
      operationId: sendWelcomeEmailTest
      tags: [users]
      summary: Send a test welcome email to the currently signed-in admin (admin only)
      responses:
        "200":
          description: Test email sent successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "400":
          description: SMTP not configured
        "403":
          description: Forbidden — admin role required
        "500":
          description: SMTP send error

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a staff user's role or active status (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Updated staff user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
        "403":
          description: Forbidden — admin role required
        "404":
          description: User not found

  /users/me/phone:
    patch:
      operationId: updateOwnPhone
      tags: [users]
      summary: Update the current user's own phone number (used for SMS password reset)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOwnPhoneInput"
      responses:
        "200":
          description: Updated staff user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"

  # ── PASSWORD RESET (public, used from the sign-in page) ──────────────────────
  /password-reset/methods:
    post:
      operationId: getPasswordResetMethods
      tags: [password-reset]
      summary: Check which reset methods (email/SMS) are available for an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetMethodsInput"
      responses:
        "200":
          description: Available reset methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetMethods"

  /password-reset/request:
    post:
      operationId: requestPasswordResetCode
      tags: [password-reset]
      summary: Request a password reset via email link or SMS code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestInput"
      responses:
        "200":
          description: Generic confirmation (never reveals account existence)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetGenericResponse"

  /password-reset/verify-sms:
    post:
      operationId: verifySmsResetCode
      tags: [password-reset]
      summary: Verify an SMS reset code and set a new password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetVerifySmsInput"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetGenericResponse"
        "400":
          description: Invalid or expired code

  # ── AUDIT LOGS ───────────────────────────────────────────────────────────────
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit-logs]
      summary: List audit log entries (admin only)
      parameters:
        - in: query
          name: entityType
          schema: { type: string }
        - in: query
          name: entityId
          schema: { type: integer }
        - in: query
          name: userId
          schema: { type: string }
        - in: query
          name: action
          schema: { type: string, enum: [create, update, delete] }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: Paginated list of audit log entries
          content:
            application/json:
              schema:
                type: object
                required: [data, page, limit]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"
                  page:
                    type: integer
                  limit:
                    type: integer
        "403":
          description: Forbidden — admin role required

  /audit-logs/purge-history:
    get:
      operationId: getAuditPurgeHistory
      tags: [audit-logs]
      summary: List recent purge runs (admin only)
      responses:
        "200":
          description: Recent purge history entries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditPurgeLog"
        "403":
          description: Forbidden — admin role required

  /audit-logs/purge:
    post:
      operationId: purgeAuditLogs
      tags: [audit-logs]
      summary: Delete audit log entries older than the configured retention period (admin only)
      responses:
        "200":
          description: Number of deleted rows
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: integer
        "403":
          description: Forbidden — admin role required

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── DASHBOARD ────────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/revenue:
    get:
      operationId: getRevenueStats
      tags: [dashboard]
      summary: Get monthly revenue statistics
      responses:
        "200":
          description: Revenue stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevenuePoint"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent system activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/subscription-breakdown:
    get:
      operationId: getSubscriptionBreakdown
      tags: [dashboard]
      summary: Get subscription status breakdown
      responses:
        "200":
          description: Subscription breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BreakdownItem"

  # ── CUSTOMERS ────────────────────────────────────────────────────────────────
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List all customers
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Not found
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /customers/{id}/vpn:
    get:
      operationId: listCustomerVpnConfigs
      tags: [vpn]
      summary: List VPN configs for a customer (always includes vpnAvailable even when empty)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: VPN config list with server availability flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VpnConfigList"
    post:
      operationId: issueCustomerVpnConfig
      tags: [vpn]
      summary: Issue a new VPN config for a customer (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Issued VPN config with .ovpn content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VpnConfigWithFile"
        "503":
          description: VPN server not configured on this host

  /customers/{id}/vpn/{configId}:
    delete:
      operationId: revokeCustomerVpnConfig
      tags: [vpn]
      summary: Revoke a VPN config (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: configId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Revoked VPN config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VpnConfig"
        "404":
          description: Config not found
        "409":
          description: Already revoked
        "503":
          description: VPN server not configured on this host

  /customers/{id}/radius-sessions:
    get:
      operationId: getCustomerRadiusSessions
      tags: [radius]
      summary: RADIUS accounting sessions for a customer (from radacct)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: RADIUS accounting session rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RadiusSession"

  /admin/radius/sync:
    post:
      operationId: syncRadius
      tags: [radius]
      summary: Re-sync all subscriptions to RADIUS tables (admin only)
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadiusSyncResult"
        "403":
          description: Forbidden

  /customers/{id}/sessions:
    get:
      operationId: getCustomerSessions
      tags: [customers]
      summary: Get live PPPoE/Hotspot session data for all customer subscriptions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Live session data per subscription
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerSession"

  /customers/{id}/usage-snapshots:
    get:
      operationId: getCustomerUsageSnapshots
      tags: [customers]
      summary: Get historical usage snapshots for all customer subscriptions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Map of subscriptionId to array of usage snapshots
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: "#/components/schemas/UsageSnapshot"

  /customers/{id}/sessions/snapshot:
    post:
      operationId: saveUsageSnapshot
      tags: [customers]
      summary: Save usage snapshots for graphing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageSnapshotBatch"
      responses:
        "201":
          description: Saved

  # ── PLANS ─────────────────────────────────────────────────────────────────────
  /plans:
    get:
      operationId: listPlans
      tags: [plans]
      summary: List all service plans
      responses:
        "200":
          description: Plans list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
    post:
      operationId: createPlan
      tags: [plans]
      summary: Create a new plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"

  /plans/{id}:
    get:
      operationId: getPlan
      tags: [plans]
      summary: Get plan by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
    patch:
      operationId: updatePlan
      tags: [plans]
      summary: Update a plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanUpdate"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
    delete:
      operationId: deletePlan
      tags: [plans]
      summary: Delete a plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── SUBSCRIPTIONS ─────────────────────────────────────────────────────────────
  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: List all subscriptions
      parameters:
        - name: customerId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Subscriptions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Create a subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/{id}:
    get:
      operationId: getSubscription
      tags: [subscriptions]
      summary: Get subscription by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
    patch:
      operationId: updateSubscription
      tags: [subscriptions]
      summary: Update a subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionUpdate"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
    delete:
      operationId: deleteSubscription
      tags: [subscriptions]
      summary: Cancel/delete a subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── INVOICES ──────────────────────────────────────────────────────────────────
  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List all invoices
      parameters:
        - name: customerId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Invoice list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceList"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get invoice by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    patch:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
