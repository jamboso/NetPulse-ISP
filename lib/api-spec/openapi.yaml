          type: integer
        subscriptionId:
          type: ["integer", "null"]
        amount:
          type: number
        tax:
          type: ["number", "null"]
        total:
          type: number
        status:
          type: string
          enum: [draft, sent, paid, overdue, cancelled]
        dueDate:
          type: string
        paidAt:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
