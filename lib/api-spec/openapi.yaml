        lateFeePercent:
          type: ["string", "null"]
        autoSuspendDays:
          type: ["string", "null"]
        gracePeriodDays:
          type: ["string", "null"]
        defaultRouterType:
          type: ["string", "null"]
        ntpServer:
          type: ["string", "null"]
        radiusServer:
          type: ["string", "null"]
        radiusSecret:
          type: ["string", "null"]
        smsProvider:
          type: ["string", "null"]
        smsApiKey:
          type: ["string", "null"]
        smsSenderId:
          type: ["string", "null"]
        telegramBotToken:
