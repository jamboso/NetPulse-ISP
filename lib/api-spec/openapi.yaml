        - createdAt
      properties:
        id:
          type: integer
        customerId:
          type: integer
        subject:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
        priority:
          type: string
          enum: [low, medium, high, critical]
        category:
          type: ["string", "null"]
        assignedTo:
          type: ["string", "null"]
        resolvedAt:
          type: ["string", "null"]
        createdAt:
          type: string
