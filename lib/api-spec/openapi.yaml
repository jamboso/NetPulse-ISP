  # ── IP POOLS ──────────────────────────────────────────────────────────────────
  /ip-pools:
    get:
      operationId: listIpPools
      tags: [ip-pools]
      summary: List all IP pools
      responses:
        "200":
          description: IP pools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IpPool"
    post:
      operationId: createIpPool
      tags: [ip-pools]
      summary: Create an IP pool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IpPoolInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpPool"

  /ip-pools/{id}:
    get:
      operationId: getIpPool
      tags: [ip-pools]
      summary: Get IP pool by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: IP pool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpPool"
    patch:
      operationId: updateIpPool
      tags: [ip-pools]
      summary: Update an IP pool
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IpPoolUpdate"
      responses:
        "200":
          description: Updated IP pool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IpPool"
    delete:
      operationId: deleteIpPool
      tags: [ip-pools]
      summary: Delete an IP pool
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── SETTINGS ──────────────────────────────────────────────────────────────────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get all app settings
      responses:
        "200":
          description: Settings object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update settings (partial)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  # ── ROUTERS ───────────────────────────────────────────────────────────────────
  /routers/status:
    get:
      operationId: getRoutersStatus
      tags: [routers]
      summary: Live reachability status for all routers (TCP probe)
      responses:
        "200":
          description: Array of router status objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RouterStatus"

  /routers:
    get:
      operationId: listRouters
      tags: [routers]
      summary: List all managed routers
      responses:
        "200":
          description: Routers list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RouterDevice"
    post:
      operationId: createRouter
      tags: [routers]
      summary: Add a router
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouterDeviceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterDevice"

  /routers/{id}/ros/live:
    get:
      operationId: getRouterRosLive
      tags: [routers]
      summary: Fetch live RouterOS data (interfaces, PPPoE, resources, DHCP, logs)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Live RouterOS data bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosLiveData"
        "404":
          description: Router not found
        "502":
          description: Cannot reach RouterOS device

  /routers/{id}:
    get:
      operationId: getRouter
      tags: [routers]
      summary: Get router by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Router
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterDevice"
        "404":
          description: Not found
    patch:
      operationId: updateRouter
      tags: [routers]
      summary: Update a router
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouterDeviceUpdate"
      responses:
        "200":
          description: Updated router
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterDevice"
    delete:
      operationId: deleteRouter
      tags: [routers]
      summary: Delete a router
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── SECURITY EVENTS ──────────────────────────────────────────────────────────
  /security-events:
    get:
      operationId: listSecurityEvents
      tags: [security-events]
      summary: List blocked M-Pesa callback attempts (admin only)
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Paginated list of security events
          content:
            application/json:
              schema:
                type: object
                required: [data, page, limit]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SecurityEvent"
                  page:
                    type: integer
                  limit:
                    type: integer
        "403":
          description: Forbidden — admin role required

  /security-events/summary:
    get:
      operationId: getSecurityEventsSummary
      tags: [security-events]
      summary: Count of blocked attempts in the last 24 hours (admin only)
      responses:
        "200":
          description: Summary of recent blocked attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEventsSummary"
        "403":
          description: Forbidden — admin role required

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── DASHBOARD ──────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required:
        - totalCustomers
        - activeSubscriptions
        - overdueInvoices
        - monthlyRevenue
        - openTickets
        - totalEquipment
        - totalIpPools
        - newCustomersThisMonth
      properties:
        totalCustomers:
          type: integer
        activeSubscriptions:
          type: integer
        overdueInvoices:
          type: integer
        monthlyRevenue:
          type: number
        openTickets:
          type: integer
        totalEquipment:
          type: integer
        totalIpPools:
          type: integer
        newCustomersThisMonth:
          type: integer

    RevenuePoint:
      type: object
      required: [month, revenue, invoiceCount]
      properties:
        month:
          type: string
        revenue:
          type: number
        invoiceCount:
          type: integer

    ActivityItem:
      type: object
      required: [id, type, description, timestamp, entityId, entityType]
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        timestamp:
          type: string
        entityId:
          type: integer
        entityType:
          type: string

    BreakdownItem:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: integer

    # ── CUSTOMERS ──────────────────────────────────────────────────────────────
    Customer:
      type: object
      required:
        - id
        - name
        - email
        - phone
        - address
        - status
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        status:
          type: string
          enum: [active, suspended, terminated]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    CustomerList:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    CustomerInput:
      type: object
      required: [name, email, phone, address]
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        status:
          type: string
          enum: [active, suspended, terminated]
        notes:
          type: string

    CustomerUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        status:
          type: string
          enum: [active, suspended, terminated]
        notes:
          type: ["string", "null"]

    # ── PLANS ──────────────────────────────────────────────────────────────────
    Plan:
      type: object
      required:
        - id
        - name
        - downloadSpeed
        - uploadSpeed
        - price
        - billingCycle
        - isActive
        - createdAt
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        downloadSpeed:
          type: integer
          description: Download speed in Mbps
        uploadSpeed:
          type: integer
          description: Upload speed in Mbps
        price:
          type: number
        billingCycle:
          type: string
          enum: [monthly, quarterly, annually]
        isActive:
          type: boolean
        rosProfileName:
          type: ["string", "null"]
          description: RouterOS PPP profile name (e.g. plan-5mbps)
        createdAt:
          type: string

    PlanInput:
      type: object
      required: [name, downloadSpeed, uploadSpeed, price, billingCycle]
      properties:
        name:
          type: string
        description:
          type: string
        downloadSpeed:
          type: integer
        uploadSpeed:
          type: integer
        price:
          type: number
        billingCycle:
          type: string
          enum: [monthly, quarterly, annually]
        isActive:
          type: boolean
        rosProfileName:
          type: string
          description: RouterOS PPP profile name (e.g. plan-5mbps)

    PlanUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        downloadSpeed:
          type: integer
        uploadSpeed:
          type: integer
        price:
          type: number
        billingCycle:
          type: string
          enum: [monthly, quarterly, annually]
        isActive:
          type: boolean
        rosProfileName:
          type: ["string", "null"]
          description: RouterOS PPP profile name (e.g. plan-5mbps)

    # ── SUBSCRIPTIONS ──────────────────────────────────────────────────────────
    Subscription:
      type: object
      required:
        - id
        - customerId
        - planId
        - status
        - startDate
        - createdAt
      properties:
        id:
          type: integer
        customerId:
          type: integer
        planId:
          type: integer
        status:
          type: string
          enum: [active, suspended, cancelled, expired]
        startDate:
          type: string
        endDate:
          type: ["string", "null"]
        ipAddress:
          type: ["string", "null"]
        macAddress:
          type: ["string", "null"]
        routerId:
          type: ["integer", "null"]
          description: RouterOS router to provision PPPoE secret on
        pppoeUsername:
          type: ["string", "null"]
          description: Auto-generated PPPoE username
        pppoePassword:
          type: ["string", "null"]
          description: Auto-generated PPPoE password
        createdAt:
          type: string
        customer:
          $ref: "#/components/schemas/Customer"
        plan:
          $ref: "#/components/schemas/Plan"

    SubscriptionInput:
      type: object
      required: [customerId, planId, startDate]
      properties:
        customerId:
          type: integer
        planId:
          type: integer
        routerId:
          type: integer
          description: RouterOS router to provision PPPoE secret on
        status:
          type: string
          enum: [active, suspended, cancelled, expired]
        startDate:
          type: string
        endDate:
          type: string
        ipAddress:
          type: string
        macAddress:
          type: string

    SubscriptionUpdate:
      type: object
      properties:
        planId:
          type: integer
        routerId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [active, suspended, cancelled, expired]
        endDate:
          type: ["string", "null"]
        ipAddress:
          type: ["string", "null"]
        macAddress:
          type: ["string", "null"]

    # ── INVOICES ───────────────────────────────────────────────────────────────
    Invoice:
      type: object
      required:
        - id
        - customerId
        - amount
        - status
        - dueDate
        - createdAt
      properties:
        id:
          type: integer
