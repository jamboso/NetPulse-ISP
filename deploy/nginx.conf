# NetPulse ISP Manager — nginx config
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/netpulse
#          sudo ln -sf /etc/nginx/sites-available/netpulse /etc/nginx/sites-enabled/netpulse
#          sudo nginx -t && sudo systemctl reload nginx
#
# For HTTPS (recommended):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d yourdomain.com

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;   # ← replace with your domain or server IP

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── In-app update endpoint — long-running SSE stream ─────
    location /api/system/update {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # update takes up to 5 min
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── API server (Express on port 8080) ────────────────────
    location /api {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }

    # ── Frontend static files ─────────────────────────────────
    root /opt/netpulse/artifacts/isp-portal/dist/public;
    index index.html;

    # Cache hashed assets forever
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
