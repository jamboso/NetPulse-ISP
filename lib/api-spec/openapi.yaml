  # ── SECURITY EVENTS ──────────────────────────────────────────────────────────
  /security-events:
    get:
      operationId: listSecurityEvents
      tags: [security-events]
      summary: List blocked M-Pesa callback attempts (admin only)
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Paginated list of security events
          content:
            application/json:
              schema:
                type: object
                required: [data, page, limit]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SecurityEvent"
                  page:
                    type: integer
                  limit:
                    type: integer
        "403":
          description: Forbidden — admin role required
    delete:
      operationId: clearSecurityEvents
      tags: [security-events]
      summary: Delete security event records older than the given retention window (admin only)
      parameters:
        - in: query
          name: retentionDays
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Keep records newer than this many days. 0 = delete all records. Must be a non-negative integer.
      responses:
        "200":
          description: Number of records deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearSecurityEventsResult"
        "400":
          description: Invalid retentionDays value
        "403":
          description: Forbidden — admin role required

  /security-events/summary:
    get:
      operationId: getSecurityEventsSummary
      tags: [security-events]
      summary: Count of blocked attempts in the last 24 hours (admin only)
      responses:
        "200":
          description: Summary of recent blocked attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEventsSummary"
        "403":
          description: Forbidden — admin role required

  /security-events/export.csv:
    get:
      operationId: exportSecurityEventsCsv
      tags: [security-events]
      summary: Export all blocked webhook attempts as a CSV file (admin only)
      responses:
        "200":
          description: CSV file of all security events
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "403":
          description: Forbidden — admin role required

  /blocked-ips:
    get:
      operationId: listBlockedIps
      tags: [security-events]
      summary: List currently auto-blocked IP addresses (admin only)
      responses:
        "200":
          description: List of active blocked IPs
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BlockedIp"
        "403":
          description: Forbidden — admin role required

  /blocked-ips/{ip}:
    delete:
      operationId: unblockIp
      tags: [security-events]
      summary: Manually unblock an IP address (admin only)
      parameters:
        - in: path
          name: ip
          required: true
          schema:
            type: string
          description: The IP address to unblock
      responses:
        "200":
          description: IP successfully unblocked
          content:
            application/json:
              schema:
                type: object
                required: [success, ip]
                properties:
                  success:
                    type: boolean
                  ip:
                    type: string
        "404":
          description: No active block found for this IP
        "403":
          description: Forbidden — admin role required

